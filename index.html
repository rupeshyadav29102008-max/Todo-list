<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List & Habit Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><h1>Task and Habit Tracker</h1></header>
  <main class="container">
    <section id="task-section" class="card">
      <h2>Task Planner</h2>
      <form id="task-form">
        <input type="text" id="task-input" placeholder="Enter task name...">
        <button type="submit" id="add-task-btn">Add Task</button>
        <p id="task-error" style="color:red;display:none;">Task title cannot be empty!</p>
      </form>
      <ul id="task-list"></ul>
    </section>
    <section id="habit-section" class="card"></section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
